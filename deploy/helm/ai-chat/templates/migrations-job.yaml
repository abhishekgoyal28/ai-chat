{{- if .Values.migrations.enabled }}
# Applies database migrations before every install and upgrade. Migrations are
# backward compatible with the previous release, so pods of the old version
# keep working while the rollout replaces them.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "ai-chat.fullname" . }}-migrate-{{ .Release.Revision }}
  labels:
    {{- include "ai-chat.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "ai-chat.labels" . | nindent 8 }}
        app.kubernetes.io/component: migrations
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "ai-chat.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          command: ["node", "dist/shared/database/migrate.js"]
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: {{ include "ai-chat.secretName" . }}, key: DATABASE_URL } }
{{- end }}
