{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "ai-chat.fullname" . }}
  labels:
    {{- include "ai-chat.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          # WebSocket only (no long-polling), so no sticky sessions are needed.
          - path: /socket.io
            pathType: Prefix
            backend:
              service:
                name: {{ include "ai-chat.fullname" . }}-chat-socket
                port: { name: http }
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "ai-chat.fullname" . }}-chat-app
                port: { name: http }
{{- end }}
