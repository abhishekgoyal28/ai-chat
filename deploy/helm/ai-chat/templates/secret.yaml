{{- if not .Values.existingSecret }}
{{- range $key := list "DATABASE_URL" "REDIS_URL" "AUTH_SECRET" "ENCRYPTION_KEY" }}
{{- if not (index $.Values.secrets $key) }}
{{- fail (printf "secrets.%s is required (or set existingSecret)" $key) }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ai-chat.fullname" . }}-secrets
  labels:
    {{- include "ai-chat.labels" . | nindent 4 }}
  annotations:
    # Created before the migration Job (a pre-install hook) needs it. For
    # production prefer existingSecret, managed outside the chart.
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  {{- range $key, $value := .Values.secrets }}
  {{- if $value }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- end }}
{{- end }}
