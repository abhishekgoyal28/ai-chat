{{- range $component, $port := dict "chat-app" 3000 "chat-socket" 3001 "chat-expert" 3002 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ai-chat.fullname" $ }}-{{ $component }}
  labels:
    {{- include "ai-chat.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  selector:
    {{- include "ai-chat.selector" (dict "root" $ "component" $component) | nindent 4 }}
  ports:
    - name: http
      port: {{ $port }}
      targetPort: http
{{- end }}
